name: Backfill Steam Games Data

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backfill missing prices and descriptions
        run: python scripts/fetch_games.py --mode=backfill

      - name: Generate RSS feed
        run: python scripts/generate_rss.py

      - name: Generate game pages and sitemap
        run: python scripts/generate_game_pages.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json data/meta.json data/fetch_queue.json docs/data/games-active.json docs/data/games-expired.json docs/data/meta.json docs/feed.xml docs/games docs/sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: backfill Steam deals metadata"
            git push
          fi
