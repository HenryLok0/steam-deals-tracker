name: Update Exchange Rates

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch exchange rates
        run: python scripts/fetch_exchange_rates.py

      - name: Commit and push if changed
        run: |
          bash .github/scripts/push_generated_changes.sh "chore: update exchange rates" \
            data/exchange-rates.json docs/data/exchange-rates.json
