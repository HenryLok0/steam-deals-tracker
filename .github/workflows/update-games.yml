name: Update Steam Free Games

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest games
        run: python scripts/fetch_games.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json data/meta.json docs/data/games.json docs/data/meta.json
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: update Steam free games data"
            git push
          fi
