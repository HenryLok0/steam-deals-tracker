name: Update Steam Free Games

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: steam-deals-data-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest games
        run: python scripts/fetch_games.py --mode=quick

      - name: Generate RSS feed
        run: python scripts/generate_rss.py

      - name: Generate game pages and sitemap
        run: python scripts/generate_game_pages.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json data/meta.json data/fetch_queue.json docs/data/games-active.json docs/data/games-expired.json docs/data/details docs/data/meta.json docs/feed.xml docs/games docs/sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: update Steam deals data"
          branch="${GITHUB_REF_NAME:-master}"

          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$branch"
            if git push origin "HEAD:$branch"; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected, retrying (${attempt}/5)..."
            sleep 15
          done

          echo "Failed to push after 5 attempts."
          exit 1
